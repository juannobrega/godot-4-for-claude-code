name: Claude Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Without this, a missing credential makes the action fail and the pull
      # request shows a red check for a reviewer that was never configured.
      # With it, the job says plainly that no review ran -- the one thing a
      # non-blocking job must never do is look green while doing nothing.
      - name: Check for the credential
        id: guard
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No Claude review ran"
              echo
              echo "\`CLAUDE_CODE_OAUTH_TOKEN\` is not set on this repository, so"
              echo "the review step was skipped. The hard gates in **Validate**"
              echo "still ran."
              echo
              echo "To enable it: run \`claude setup-token\` locally and add the"
              echo "result as a repository secret named \`CLAUDE_CODE_OAUTH_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Claude review skipped: CLAUDE_CODE_OAUTH_TOKEN is not set."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.present == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action starts the inline-comment MCP server only when
          # --allowedTools names it, even though the skill's own frontmatter does.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
