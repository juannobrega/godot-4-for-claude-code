name: Release

# Fires when a pull request into main is merged, not on push to main. The
# pull_request event carries the description, which is where the release
# increment is declared -- a push event would have to go looking for it.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0        # tags are needed to compute the next version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Revalidate on the merged result. The pull request was validated against
      # its own head; main is what actually ships.
      - name: Revalidate
        run: |
          python3 tools/validate_kit.py
          shellcheck -x -S warning .claude/scripts/*.sh install.sh

      - name: Compute the next version
        id: version
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          increment="$(printf '%s' "$PR_BODY" \
            | grep -ioE '^Release:[[:space:]]*(major|minor|patch)[[:space:]]*$' \
            | head -1 | tr -d ' \r' | cut -d: -f2 | tr 'A-Z' 'a-z')"
          if [ -z "$increment" ]; then
            for label in $PR_LABELS; do
              case "$label" in
                release:major|release:minor|release:patch)
                  increment="${label#release:}" ;;
              esac
            done
          fi
          if [ -z "$increment" ]; then
            echo "::error::Merged without a release increment. Tag by hand, or"
            echo "reopen with 'Release: <major|minor|patch>' in the description."
            exit 1
          fi

          last="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          [ -z "$last" ] && last="v0.0.0"
          IFS=. read -r major minor patch <<< "${last#v}"

          case "$increment" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "tag=v$version"          >> "$GITHUB_OUTPUT"
          echo "increment=$increment"   >> "$GITHUB_OUTPUT"
          echo "previous=$last"         >> "$GITHUB_OUTPUT"
          echo "$last + $increment -> v$version" >> "$GITHUB_STEP_SUMMARY"

      # Only the payload a user installs. docs/, tools/ and .github/ are how
      # this repository is built, not what it ships.
      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          stage="dist/godot-4"
          mkdir -p "$stage/.claude"
          cp -R .claude/skills .claude/commands .claude/agents \
                .claude/scripts .claude/templates "$stage/.claude/"
          cp .claude/settings.json "$stage/.claude/"
          # INSTALL.md instead of the repository README: the README is about
          # contributing to this framework, not about installing it.
          cp LICENSE install.sh install.ps1 installer.py "$stage/"
          echo "$VERSION" > "$stage/VERSION"
          chmod +x "$stage/install.sh" "$stage"/.claude/scripts/*.sh \
                   "$stage"/.claude/scripts/*.py

          cat > "$stage/INSTALL.md" <<'INSTALL'
          # Install godot-4

          Run the installer from inside your Godot project. It walks up to find
          `project.godot`, so any subdirectory of the project works.

          ## macOS / Linux

              cd /path/to/your-godot-project
              /tmp/godot-4/install.sh

          ## Windows

              cd C:\path\to\your-godot-project
              & $env:TEMP\godot-4\install.ps1

          Adjust the path if you extracted the package somewhere else.

          `--dry-run` (`-DryRun` on Windows) prints what would be written without
          writing it; `--help` lists the rest.

          The installer merges its hooks into an existing `.claude/settings.json`
          rather than replacing it, and running it twice changes nothing.

          Then, in that project:

              /godot-4:init
          INSTALL
          sed -i 's/^          //' "$stage/INSTALL.md"

          # validate_kit.py runs py_compile before this step, which drops a
          # __pycache__ beside the scripts. v0.1.0 shipped one.
          find "$stage" \( -name '__pycache__' -o -name '*.pyc' \) -exec rm -rf {} +

          # Guard the exclusion rather than trusting the copy list above: a
          # correct list today starts leaking the day someone adds a directory.
          # The installers delegate every file operation to installer.py, so a
          # package without it cannot install at all.
          for required in install.sh install.ps1 installer.py VERSION; do
            [ -f "$stage/$required" ] || { echo "::error::$required missing from the package"; exit 1; }
          done

          for unwanted in docs tools .github .git; do
            if [ -e "$stage/$unwanted" ]; then
              echo "::error::$unwanted leaked into the package"; exit 1
            fi
          done
          if find "$stage" \( -name '__pycache__' -o -name '*.pyc' \) | grep -q .; then
            echo "::error::build artefacts leaked into the package"; exit 1
          fi

          # Two archives, one payload. The format is what differs by platform:
          # unzip is absent on minimal Linux images, and tar.gz is foreign on
          # Windows. Splitting the payload itself would only leave two identical
          # trees to keep in step.
          (cd dist && tar -czf godot-4.tar.gz godot-4)
          (cd dist && zip -qr godot-4.zip godot-4)
          echo "--- package root"
          (cd dist && unzip -l godot-4.zip | awk '$4 ~ /^godot-4\/[^\/]+$/ {print $4}')
          ls -lh dist/godot-4.tar.gz dist/godot-4.zip | awk '{print $5, $NF}'

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

          # Release notes are written from the package itself, so the counts
          # can never drift from what actually shipped.
          skills=$(find dist/godot-4/.claude/skills -name SKILL.md | wc -l | tr -d ' ')
          commands=$(find dist/godot-4/.claude/commands -name '*.md' | wc -l | tr -d ' ')
          agents=$(find dist/godot-4/.claude/agents -name '*.md' | wc -l | tr -d ' ')
          hooks=$(python3 -c "import json;print(sum(len(v) for v in json.load(open('dist/godot-4/.claude/settings.json'))['hooks'].values()))")

          if [ "$PREVIOUS" = "v0.0.0" ]; then
            changes="First release."
            compare=""
          else
            changes="$(git log --no-merges --pretty='- %s' "$PREVIOUS..HEAD")"
            compare="**Full changelog:** https://github.com/${{ github.repository }}/compare/$PREVIOUS...$TAG"
          fi

          cat > notes.md <<NOTES
          Spec-driven development framework for Godot 4 in Claude Code.

          ## Install

          **macOS / Linux** — run these from inside your Godot project. The
          package goes to /tmp, so nothing is left in the project:

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/godot-4.tar.gz | tar -xz -C /tmp
          /tmp/godot-4/install.sh
          \`\`\`

          **Windows** — from inside your Godot project:

          \`\`\`powershell
          Invoke-WebRequest https://github.com/${{ github.repository }}/releases/latest/download/godot-4.zip -OutFile \$env:TEMP\\godot-4.zip
          Expand-Archive \$env:TEMP\\godot-4.zip -DestinationPath \$env:TEMP -Force
          & \$env:TEMP\\godot-4\\install.ps1
          \`\`\`

          The installer walks up to find \`project.godot\`, so any subdirectory
          works. It merges its hooks into an existing \`settings.json\` instead of
          replacing it, and is a no-op when run twice. \`--dry-run\` shows what it
          would write. Then \`/godot-4:init\`.

          ## Contents

          | | |
          |---|---|
          | Skills | $skills |
          | Commands | $commands |
          | Agents | $agents |
          | Hooks | $hooks |

          ## Changes

          $changes

          From #$PR_NUMBER — $PR_TITLE

          $compare
          NOTES
          sed -i 's/^          //' notes.md

          # Asset names carry no version, so the "latest/download/<name>"
          # URLs stay stable across releases.
          gh release create "$TAG" dist/godot-4.tar.gz dist/godot-4.zip \
            --title "$TAG" --notes-file notes.md
