name: Claude Mentions

# Interactive mode: no prompt input, so Claude waits for the trigger phrase in
# a comment instead of running on its own. Separate from claude-review.yml
# because that one runs on pull request events and this one on comments.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Keeps a runner from starting on every comment in the repository. The
    # action checks the trigger phrase again on its side.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Check for the credential
        id: guard
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::@claude mention ignored: CLAUDE_CODE_OAUTH_TOKEN is not set."
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.present == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
